name: SampleApp
options:
  bundleIdPrefix: dev.simurgh.fixtures
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  TARGETED_DEVICE_FAMILY: "1"
targets:
  SampleApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.simurgh.fixtures.sampleapp
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "1.0"
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: SampleApp
  SampleAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - SampleAppUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.simurgh.fixtures.sampleappuitests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SampleApp
schemes:
  SampleApp:
    build:
      targets:
        SampleApp: all
        SampleAppUITests: [test]
    test:
      config: Debug
      targets:
        - SampleAppUITests
    run:
      config: Debug
